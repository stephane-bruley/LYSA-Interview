services:
  db:
    image: postgres:16-alpine
    container_name: lysa-db
    environment:
      POSTGRES_USER: lysa
      POSTGRES_PASSWORD: lysa
      POSTGRES_DB: lysa
    # 5433 on purpose: a PostgreSQL already installed on the machine keeps 5432.
    ports:
      - '5433:5432'
    volumes:
      - lysa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lysa -d lysa']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lysa-db-data:
